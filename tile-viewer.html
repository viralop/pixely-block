<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Expansion Tile Viewer</title>
<style>
  body { background: #1a1a2e; color: #eee; font-family: monospace; margin: 20px; }
  h1 { color: #e94560; margin-bottom: 5px; }
  h2 { color: #5ee8d0; margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 5px; }
  .grid { display: grid; grid-template-columns: repeat(16, 80px); gap: 4px; margin: 10px 0 30px; }
  .tile {
    background: #0f0f23; border: 1px solid #333; border-radius: 4px;
    display: flex; flex-direction: column; align-items: center; padding: 4px;
    position: relative; cursor: pointer;
  }
  .tile:hover { border-color: #5ee8d0; background: #1a1a3e; }
  .tile canvas { image-rendering: pixelated; width: 54px; height: 54px; }
  .tile .id { font-size: 10px; color: #888; margin-top: 2px; }
  .tile .pos { font-size: 9px; color: #555; }
  #preview-box {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #0f0f23; border: 2px solid #5ee8d0; border-radius: 8px; padding: 20px;
    z-index: 100; text-align: center;
  }
  #preview-box canvas { image-rendering: pixelated; width: 180px; height: 180px; }
  #preview-box .info { color: #5ee8d0; margin-top: 10px; font-size: 14px; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
</style>
</head>
<body>
<h1>Expansion Tileset Viewer</h1>
<div id="content"></div>
<div id="overlay" onclick="closePreview()"></div>
<div id="preview-box">
  <canvas id="prev-canvas" width="180" height="180"></canvas>
  <div class="info" id="prev-info"></div>
</div>
<script>
const TS = 18, TSPACE = 1, SCALE = 10;
const TILESETS = [
  { name: 'Farm', url: 'kenney_pixel-platformer-farm-expansion/Tilemap/tilemap.png', gid0: 1000, cols: 16, rows: 7, count: 112 },
  { name: 'Food', url: 'kenney_pixel-platformer-food-expansion/Tilemap/tilemap.png', gid0: 2000, cols: 16, rows: 7, count: 112 },
  { name: 'Industrial', url: 'kenney_pixel-platformer-industrial-expansion/Tilemap/tilemap.png', gid0: 3000, cols: 16, rows: 7, count: 112 }
];

const container = document.getElementById('content');

Promise.all(TILESETS.map(ts => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve({ ...ts, img });
  img.onerror = reject;
  img.src = ts.url;
}))).then(sets => {
  sets.forEach(ts => {
    const h2 = document.createElement('h2');
    h2.textContent = ts.name + ' (' + ts.gid0 + ' - ' + (ts.gid0 + ts.count - 1) + ')';
    container.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (let i = 0; i < ts.count; i++) {
      const id = ts.gid0 + i;
      const col = i % ts.cols;
      const row = Math.floor(i / ts.cols);
      const sx = col * (TS + TSPACE);
      const sy = row * (TS + TSPACE);

      const tile = document.createElement('div');
      tile.className = 'tile';

      const c = document.createElement('canvas');
      c.width = TS; c.height = TS;
      const cx = c.getContext('2d');
      cx.imageSmoothingEnabled = false;
      cx.drawImage(ts.img, sx, sy, TS, TS, 0, 0, TS, TS);
      tile.appendChild(c);

      const idLabel = document.createElement('div');
      idLabel.className = 'id';
      idLabel.textContent = id;
      tile.appendChild(idLabel);

      const posLabel = document.createElement('div');
      posLabel.className = 'pos';
      posLabel.textContent = 'r' + row + ' c' + col;
      tile.appendChild(posLabel);

      tile.onclick = () => showPreview(ts.img, sx, sy, id, row, col, ts.name);
      grid.appendChild(tile);
    }

    container.appendChild(grid);
  });
});

function showPreview(img, sx, sy, id, row, col, name) {
  const c = document.getElementById('prev-canvas');
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, 180, 180);
  cx.drawImage(img, sx, sy, TS, TS, 0, 0, 180, 180);
  document.getElementById('prev-info').textContent = name + ' | ID: ' + id + ' | Row: ' + row + ' Col: ' + col;
  document.getElementById('preview-box').style.display = 'block';
  document.getElementById('overlay').style.display = 'block';
}

function closePreview() {
  document.getElementById('preview-box').style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
}
</script>
</body>
</html>
