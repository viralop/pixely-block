<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixely Block - A Platformer Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #080810;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #1a1a2e;
            box-shadow: 0 0 30px rgba(255,180,0,0.12), 0 0 80px rgba(100,50,200,0.15), inset 0 0 30px rgba(0,0,0,0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="864" height="540"></canvas>
    <script type="module" src="js/main.js"></script>
</body>
</html>
